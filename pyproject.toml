[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "symbox"
version = "0.6.0"
description = "An atomic symbolic state and truth-maintenance CLI for agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ltms>=0.1.0",
    "z3-solver>=5.0.0.0",
]

[project.scripts]
sbox = "symbox.cli.main:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["symbox"]
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["symbox"]
